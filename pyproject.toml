[project]
authors = [{name = "Roeland Nieboer", email = "roeland.nieboer@deltares.nl"}]
dependencies = ["h5py", "numpy", "scipy", "matplotlib", "python-dotenv", "tzdata"]
name = "BeaverFiber"
readme = "readme.md"
requires-python = ">= 3.11"
version = "0.1.0"

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["win-64", "linux-64"]

[tool.pixi.pypi-dependencies]
beaverfiber = { path = ".", editable = true }

[tool.pixi.tasks]
view-events = "python view_events.py"
waterfall-stream = "python waterfall_stream.py"

[tool.pixi.dependencies]
numpy = ">=2.5.4,<3"
scipy = ">=1.18.1,<2"
matplotlib = ">=3.11.2,<4"
python-dotenv = ">=1.2.4,<2"
h5py = ">=3.16.0,<4"
